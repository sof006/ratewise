[package]
name = "ratewise"
version = "0.1.1"
edition = "2024"
description = "View and set Linux sound-card sample rates, formats and buffer sizes"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "ratewise"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
png = { version = "0.18", optional = true }
# No default features: those pull in a system-tray stack we don't use.
slint = { version = "1.18", default-features = false, optional = true, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
] }

[build-dependencies]
slint-build = { version = "1.18", optional = true }

[features]
default = ["gui"]
gui = ["dep:slint", "dep:slint-build", "dep:png"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind" # the crash handler (spec §6.3) needs unwinding

[dev-dependencies]
proptest = "1"
